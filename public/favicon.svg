<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background circle/square for tab icon -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  
  <g transform="translate(30, 20) scale(0.9)">
    <!-- Yellow note sticking out -->
    <path d="M 120 160 L 160 80 L 260 130 Z" fill="#E5A823"/>
    
    <!-- Maroon note sticking out -->
    <path d="M 100 150 L 250 80 L 290 140 Z" fill="#8A1529"/>
    
    <!-- Pocket Main Body -->
    <path d="M 70 160 C 140 180, 360 180, 430 160 L 410 320 L 256 440 L 100 320 Z" fill="#8A1529" stroke="#8A1529" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Pocket Inner Fill -->
    <path d="M 85 175 C 150 192, 350 192, 415 175 L 398 312 L 256 422 L 112 312 Z" fill="#FFFFFF"/>
    
    <!-- Pocket Inner Stitching Line (Dashed) -->
    <path d="M 100 190 C 160 205, 340 205, 400 190 L 385 305 L 256 405 L 125 305 Z" fill="none" stroke="#8A1529" stroke-width="10" stroke-dasharray="16 12" stroke-linecap="round"/>
    
    <!-- Golden Ring Rivet -->
    <circle cx="390" cy="205" r="16" fill="none" stroke="#E5A823" stroke-width="10"/>
  </g>
</svg>
